            wildcard: 0.0.0.3
            area: 0
          - network: 10.0.255.8
            wildcard: 0.0.0.3
            area: 0
          - network: 172.16.110.0
            wildcard: 0.0.0.255
            area: 0
          - network: 172.16.120.0
            wildcard: 0.0.0.255
            area: 0
          - network: 172.16.150.0
            wildcard: 0.0.0.255
            area: 0
          - network: 172.16.190.0
            wildcard: 0.0.0.255
