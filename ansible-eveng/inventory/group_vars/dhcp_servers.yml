---
# Interface of DHCP server to HN-DATACENTER
dhcp_interface: ens3

dhcp_domain: "{{ domain_name }}"
dhcp_default_lease: 3600
dhcp_max_lease: 7200

dhcp_dns_servers:
  - "{{ hostvars['dns-ftp'].lan_ip }}"
dhcp_ntp_servers:
  - "{{ hostvars['ntp-syslog-tftp'].lan_ip }}"

dhcp_subnets:
  - name: VCB-DC
    network: 172.16.10.0
    netmask: 255.255.255.0
  - name: HN-OFFICE-IT
    network: 172.16.110.0
    netmask: 255.255.255.0
    gateway: 172.16.110.1
    range_start: 172.16.110.10
    range_end: 172.16.110.209
  - name: HN-OFFICE-ACC
    network: 172.16.120.0
    netmask: 255.255.255.0
    gateway: 172.16.120.1
    range_start: 172.16.120.10
    range_end: 172.16.120.209
  - name: HN-OFFICE-GUEST
    network: 172.16.150.0
    netmask: 255.255.255.0
    gateway: 172.16.150.1
    range_start: 172.16.150.10
    range_end: 172.16.150.209

dhcp_reservations: []
#  - { name: it-hn, mac: "aa:bb:cc:dd:ee:01", ip: 10.10.20.50 }
