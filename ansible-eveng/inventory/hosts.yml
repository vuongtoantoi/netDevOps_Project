---
# ansible_host = IP dùng để SSH (IP quản trị / OOB-MNG)
# lan_ip       = IP thật của server trên mạng dữ liệu (dùng để render DNS/DHCP)
# ==> Tất cả IP dưới đây là PLACEHOLDER, hãy thay bằng IP thực tế trong lab của bạn.
all:
  children:
    linux_servers:
      children:
        dhcp_servers:
          hosts:
            dhcp-vcb:               # VCB DATA CENTER
              ansible_host: 192.168.100.12
              lan_ip: 10.10.10.10
        dns_servers:
          hosts:
            dns-ftp:                # FPT LAN
              ansible_host: 192.168.100.11
              lan_ip: 10.20.0.10
        other_servers:
          hosts:
            ntp-syslog-tftp:        # VCB DATA CENTER
              ansible_host: 192.168.100.13
              lan_ip: 10.10.10.11
            in-vcb:                 # VCB DATA CENTER
              ansible_host: 192.168.100.14
              lan_ip: 10.10.10.12
            vcb-web:                # VCB PUBLIC (DMZ)
              ansible_host: 192.168.100.15
              lan_ip: 10.10.99.10
            fpt-vn:                 # FPT LAN
              ansible_host: 192.168.100.16
              lan_ip: 10.20.0.11
