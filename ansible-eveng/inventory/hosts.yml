---
# ansible_host = IP dùng để SSH (IP quản trị / OOB-MNG)
# lan_ip       = IP thật của server trên mạng dữ liệu (dùng để render DNS/DHCP)
# ==> Tất cả IP dưới đây là PLACEHOLDER, hãy thay bằng IP thực tế trong lab của bạn.
all:
  children:
    linux_servers:
      children:
        dhcp_servers:
          hosts:
            dhcp-vcb:
              ansible_host: 172.16.184.128
              lan_ip: 172.16.10.5
        dns_servers:
          hosts:
            dns-ftp:
              ansible_host: 172.16.184.128
              lan_ip: 222.222.222.223
        other_servers:
          hosts:
            ntp-syslog-tftp:
              ansible_host: 172.16.184.128
              lan_ip: 172.16.10.6
            in-vcb:
              ansible_host: 172.16.184.128
              lan_ip: 172.16.10.4
            vcb-web:
              ansible_host: 172.16.184.128
              lan_ip: 172.16.11.10
            fpt-vn:
              ansible_host: 172.16.184.128
              lan_ip: 222.222.222.222
