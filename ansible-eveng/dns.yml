---
- name: Cấu hình DNS authoritative BIND9 (DNS-FTP)
  hosts: dns_servers
  become: true

  tasks:
    - name: Cài bind9
      ansible.builtin.apt:
        name:
          - bind9
          - bind9utils
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: manage_packages | bool

    - name: Tạo thư mục chứa file zone
      ansible.builtin.file:
        path: "{{ dns_zone_dir }}"
        state: directory
        owner: root
        group: bind
        mode: "0755"

    - name: Render file zone từ template (mỗi zone một file)
      ansible.builtin.template:
        src: db.zone.j2
        dest: "{{ dns_zone_dir }}/db.{{ zone.name }}"
        owner: root
        group: bind
        mode: "0644"
        validate: "named-checkzone {{ zone.name }} %s"
      loop: "{{ dns_zones }}"
      loop_control:
        loop_var: zone
        label: "{{ zone.name }}"
      notify: Restart bind9

    - name: Render /etc/bind/named.conf.local
      ansible.builtin.template:
        src: named.conf.local.j2
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: "0644"
        validate: "named-checkconf %s"
      notify: Restart bind9

    - name: Chạy các handler đang chờ
      ansible.builtin.meta: flush_handlers

    - name: Bật service khi boot và đảm bảo đang chạy
      ansible.builtin.service:
        name: bind9
        state: started
        enabled: true

    - name: Kiểm tra toàn bộ cấu hình và nạp thử mọi zone
      ansible.builtin.command: named-checkconf -z
      changed_when: false

  handlers:
    - name: Restart bind9
      ansible.builtin.service:
        name: bind9
        state: restarted
