# Syslog server toi gian cho thiet bi mang
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

global(workDirectory="/var/spool/rsyslog")

template(name="NetFmt" type="string"
         string="%timegenerated:::date-rfc3339% %fromhost-ip% %syslogfacility-text%.%syslogseverity-text% %msg%\n")
template(name="PerHost" type="string"
         string="/var/log/network/%fromhost-ip%/%$YEAR%-%$MONTH%-%$DAY%.log")

# Moi thiet bi 1 thu muc theo IP nguon, moi ngay 1 file
action(type="omfile" dynaFile="PerHost" template="NetFmt"
       dirCreateMode="0755" fileCreateMode="0644")
# Them 1 file gop tat ca de tail -f cho tien
action(type="omfile" file="/var/log/network/all.log" template="NetFmt")
